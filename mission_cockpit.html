    const { useState, useEffect, useMemo } = React;

    // Helper to render Lucide Icons in standalone React
    const LucideIcon = ({ name, size = 16, className = "", style = {} }) => {
      const containerRef = React.useRef(null);

      React.useEffect(() => {
        if (containerRef.current && window.lucide) {
          const iconPascalToKebab = name
            .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
            .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
            .toLowerCase();
          
          containerRef.current.innerHTML = `<i data-lucide="${iconPascalToKebab}" style="width: ${size}px; height: ${size}px;"></i>`;
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name, size, className]);

      return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, ...style }} />;
    };

    // Cockpit Audio Synthesizer (Web Audio API)
    const playCockpitBeep = (type = 'click') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'heavy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'heaven') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const chordOsc = ctx.createOscillator();
            const chordGain = ctx.createGain();
            chordOsc.connect(chordGain);
            chordGain.connect(ctx.destination);
            chordOsc.type = 'sine';
            chordOsc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
            chordGain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.08);
            chordGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            chordOsc.start(ctx.currentTime + i * 0.08);
            chordOsc.stop(ctx.currentTime + 1.2);
          });
        }
      } catch (e) {}
    };

                title={`${title} 0으로 초기화`}

                  <stop offset="0%" stopColor="#1e293b" />
                  <stop offset="30%" stopColor={color} />
                  <stop offset="100%" stopColor="#ffffff" />

                <filter id={`glow-${title}`} x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>

              <path
                d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`}
                fill="none"
                stroke="#1e293b"
                strokeWidth="14"
                strokeLinecap="round"
              />

              {[0, 25, 50, 75, 100].map((tickPercent) => {
                const rad = Math.PI - (tickPercent / 100) * Math.PI;
                const x1 = cx + (r + 7) * Math.cos(rad);
                const y1 = cy - (r + 7) * Math.sin(rad);
                const x2 = cx + (r - 7) * Math.cos(rad);
                const y2 = cy - (r - 7) * Math.sin(rad);
                return (
                  <line
                    key={tickPercent}
                    x1={x1}
                    y1={y1}
                    x2={x2}
                    y2={y2}
                    stroke="#475569"
                    strokeWidth={tickPercent % 50 === 0 ? "2" : "1.2"}
                  />
                );
              })}

              <path

                stroke={`url(#grad-${title})`}
                strokeWidth="12"

    // 2. Airspeed Tape / Vertical Bar Gauge Component
    const SpeedometerBar = ({ value, target, onAdd, onReset, onUndo, canUndo }) => {

              </button>

              <button

    };

    // 3. Fuel Tank / Vertical Bar Gauge Component
    const PRAYER_FOCUS_TOPICS = [

    const FuelGaugeBar = ({ value, target, onAdd, onReset, onUndo, canUndo, soundEnabled }) => {
      const [inputVal, setInputVal] = useState('');
      const [showTopicsModal, setShowTopicsModal] = useState(false);

    // Main Cockpit App Component
    function App() {
      const [metrics, setMetrics] = useState({
        simple: 0,
        valid: 0,
        baptism: 0,
        attendance: 0,
        online: 0,
        prayer: 0,
      });

      const [section1History, setSection1History] = useState([]);
      const [onlineHistory, setOnlineHistory] = useState([]);
      const [prayerHistory, setPrayerHistory] = useState([]);

      const [targets, setTargets] = useState({
        simple: 25000,
        valid: 120,
        baptism: 12,
        attendance: 12,
        online: 7500,
        prayer: 3000,
      });

      const [selectedContinent, setSelectedContinent] = useState('auto');
      const [tempContinent, setTempContinent] = useState('auto');

      const [soundEnabled, setSoundEnabled] = useState(true);
      const [currentTime, setCurrentTime] = useState(new Date());
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [tempTargets, setTempTargets] = useState({ ...targets });

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const flightProgress = useMemo(() => {
        const s = (metrics.simple / targets.simple) * 100;
        const v = (metrics.valid / targets.valid) * 100;
        const b = (metrics.baptism / targets.baptism) * 100;
        const a = (metrics.attendance / targets.attendance) * 100;
        const o = (metrics.online / targets.online) * 100;
        const p = (metrics.prayer / targets.prayer) * 100;
        
        const avg = (s + v + b + a + o + p) / 6;
        return Math.min(100, Math.max(0, avg));
      }, [metrics, targets]);

      const handleAddValue = (key, categoryName, amount) => {
        if (['simple', 'valid', 'baptism', 'attendance'].includes(key)) {
          setSection1History((prev) => [
            {
              simple: metrics.simple,
              valid: metrics.valid,
              baptism: metrics.baptism,
              attendance: metrics.attendance,
            },
            ...prev.slice(0, 19),
          ]);
        } else if (key === 'online') {
          setOnlineHistory((prev) => [metrics.online, ...prev.slice(0, 19)]);
        } else if (key === 'prayer') {
          setPrayerHistory((prev) => [metrics.prayer, ...prev.slice(0, 19)]);
        }

        const nextTotal = metrics[key] + amount;

        if (soundEnabled) {
          if (flightProgress >= 99) {
            playCockpitBeep('heaven');
          } else {
            playCockpitBeep(amount >= 50 ? 'heavy' : 'click');
          }
        }

        setMetrics((prev) => ({
          ...prev,
          [key]: nextTotal,
        }));
      };

      const handleResetSingle = (key) => {
        if (['simple', 'valid', 'baptism', 'attendance'].includes(key)) {
          setSection1History((prev) => [
            {
              simple: metrics.simple,
              valid: metrics.valid,
              baptism: metrics.baptism,
              attendance: metrics.attendance,
            },
            ...prev.slice(0, 19),
          ]);
        } else if (key === 'online') {
          setOnlineHistory((prev) => [metrics.online, ...prev.slice(0, 19)]);
        } else if (key === 'prayer') {
          setPrayerHistory((prev) => [metrics.prayer, ...prev.slice(0, 19)]);
        }

        if (soundEnabled) playCockpitBeep('heavy');
        setMetrics((prev) => ({
          ...prev,
          [key]: 0,
        }));
      };

      const handleResetSection1 = () => {
        setSection1History((prev) => [
          {
            simple: metrics.simple,
            valid: metrics.valid,
            baptism: metrics.baptism,
            attendance: metrics.attendance,
          },
          ...prev.slice(0, 19),
        ]);

        if (soundEnabled) playCockpitBeep('heavy');
        setMetrics((prev) => ({
          ...prev,
          simple: 0,
          valid: 0,
          baptism: 0,
          attendance: 0,
        }));
      };

      const handleUndoSection1 = () => {
        if (section1History.length === 0) return;
        const [lastState, ...remainingHistory] = section1History;
        setMetrics((prev) => ({
          ...prev,
          simple: lastState.simple,
          valid: lastState.valid,
          baptism: lastState.baptism,
          attendance: lastState.attendance,
        }));
        setSection1History(remainingHistory);
        if (soundEnabled) playCockpitBeep('click');
      };

      const handleUndoOnline = () => {
        if (onlineHistory.length === 0) return;
        const [lastVal, ...remaining] = onlineHistory;
        setMetrics((prev) => ({ ...prev, online: lastVal }));
        setOnlineHistory(remaining);
        if (soundEnabled) playCockpitBeep('click');
      };

      const handleUndoPrayer = () => {
        if (prayerHistory.length === 0) return;
        const [lastVal, ...remaining] = prayerHistory;
        setMetrics((prev) => ({ ...prev, prayer: lastVal }));
        setPrayerHistory(remaining);
        if (soundEnabled) playCockpitBeep('click');
      };

      const handleResetAll = () => {
        if (window.confirm("모든 비행 계기판의 누적 데이터를 초기화하시겠습니까?")) {
          setSection1History((prev) => [
            {
              simple: metrics.simple,
              valid: metrics.valid,
              baptism: metrics.baptism,
              attendance: metrics.attendance,
            },
            ...prev.slice(0, 19),
          ]);
          setOnlineHistory((prev) => [metrics.online, ...prev.slice(0, 19)]);
          setPrayerHistory((prev) => [metrics.prayer, ...prev.slice(0, 19)]);

          if (soundEnabled) playCockpitBeep('heavy');
          setMetrics({
            simple: 0,
            valid: 0,
            baptism: 0,
            attendance: 0,
            online: 0,
            prayer: 0,
          });
        }
      };

      const handleOpenConfig = () => {
        setTempTargets({ ...targets });
        setTempContinent(selectedContinent);
        setShowConfigModal(true);
      };

      const handleSaveTargets = (e) => {
        e.preventDefault();
        setTargets({ ...tempTargets });
        setSelectedContinent(tempContinent);
        setShowConfigModal(false);
        if (soundEnabled) playCockpitBeep('click');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-3 sm:p-5 flex flex-col font-sans">
          <header className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 sm:p-4 mb-4 shadow-2xl backdrop-blur-md flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 text-slate-950 font-black">
                <LucideIcon name="plane" size={22} className="text-white transform -rotate-45" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base sm:text-lg font-black tracking-wider text-white uppercase flex items-center gap-2 font-mono">
                    선교 항공기 통합 계기판
                  </h1>
                  <span className="px-2 py-0.5 text-[9px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full animate-pulse">
                    AUTO-GUIDANCE ACTIVE
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 font-mono">
                  CALLSIGN: GLOBAL-MISSION-777 • HUD GLASS COCKPIT
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4 bg-slate-950/80 px-3.5 py-1.5 rounded-xl border border-slate-800">
              <div className="text-center">
                <span className="text-[9px] font-mono text-slate-500 block">전체 순항률</span>
                <span className="text-xs sm:text-sm font-bold font-mono text-cyan-400">{flightProgress.toFixed(1)}%</span>
              </div>
              <div className="h-6 w-px bg-slate-800"></div>
              <div className="text-center">
                <span className="text-[9px] font-mono text-slate-500 block">FLIGHT CLOCK (KST)</span>
                <span className="text-xs sm:text-sm font-bold font-mono text-amber-400">
                  {currentTime.toLocaleTimeString('ko-KR', { hour12: false })}
                </span>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setSoundEnabled(!soundEnabled)}
                className={`p-2 rounded-xl border transition-all flex items-center justify-center ${
                  soundEnabled 
                    ? 'bg-slate-800 text-cyan-400 border-cyan-500/40 shadow-inner' 
                    : 'bg-slate-900 text-slate-500 border-slate-800'
                }`}
                title="사운드 토글"
              >
                {soundEnabled ? <LucideIcon name="volume-2" size={16} /> : <LucideIcon name="volume-x" size={16} />}
              </button>
              <button
                onClick={handleOpenConfig}
                className="flex items-center gap-1 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono font-semibold rounded-xl border border-slate-700 transition-all shadow-sm"
              >
                <LucideIcon name="settings-2" size={15} />
                <span>목표치/대륙 설정</span>
              </button>
              <button
                onClick={handleResetAll}
                className="flex items-center gap-1 px-3 py-2 bg-red-950/50 hover:bg-red-900/60 text-red-300 text-xs font-mono font-semibold rounded-xl border border-red-800/60 transition-all shadow-sm active:scale-95"
              >
                <LucideIcon name="trash-2" size={15} />
                <span>전체 초기화</span>
              </button>
            </div>
          </header>

          <TopPanoramicGlobeViewer currentProgress={flightProgress} selectedContinentId={selectedContinent} />

          <main className="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">
            <section className="lg:col-span-6 bg-slate-950/70 border border-slate-800/90 rounded-3xl p-4 shadow-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-3">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></span>
                  <h2 className="text-xs sm:text-sm font-black text-slate-200 tracking-wider font-mono">
                    전도 계기판
                  </h2>
                </div>
                
                <div className="flex items-center gap-2">
                  <button
                    onClick={handleUndoSection1}
                    disabled={section1History.length === 0}
                    title="전도 계기판 직전 상태로 되돌리기"
                    className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-mono transition-all active:scale-95 border ${
                      section1History.length > 0
                        ? 'text-cyan-300 bg-cyan-950/60 border-cyan-800/70 hover:bg-cyan-900/50'
                        : 'text-slate-600 bg-slate-900/40 border-slate-800 cursor-not-allowed opacity-50'
                    }`}
                  >
                    <LucideIcon name="undo-2" size={11} />
                    <span>되돌리기</span>
                  </button>

                  <button
                    onClick={handleResetSection1}
                    title="전도 계기판의 4개 지표 일괄 초기화"
                    className="flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-mono text-red-400 bg-red-950/40 border border-red-900/60 hover:bg-red-900/40 transition-all active:scale-95"
                  >
                    <LucideIcon name="rotate-ccw" size={10} />
                    <span>전도 계기판 전체 리셋</span>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <SemiCircleGauge
                  title="단순전도"
                  subtitle="SIMPLE OUTREACH"
                  value={metrics.simple}
                  target={targets.simple}
                  color="#06b6d4"
                  unit="회"
                  iconName="target"
                  quickSteps={[100, 500, 1000]}
                  onAdd={(amt) => handleAddValue('simple', '단순전도', amt)}
                  onReset={() => handleResetSingle('simple')}
                />

                <SemiCircleGauge
                  title="유효전도"
                  subtitle="EFFECTIVE OUTREACH"
                  value={metrics.valid}
                  target={targets.valid}
                  color="#10b981"
                  unit="명"
                  iconName="users"
                  quickSteps={[1, 5, 10]}
                  onAdd={(amt) => handleAddValue('valid', '유효전도', amt)}
                  onReset={() => handleResetSingle('valid')}
                />

                <SemiCircleGauge
                  title="침례"
                  subtitle="BAPTISM HARVEST"
                  value={metrics.baptism}
                  target={targets.baptism}
                  color="#6366f1"
                  unit="명"
                  iconName="award"
                  quickSteps={[1, 2, 5]}
                  onAdd={(amt) => handleAddValue('baptism', '침례', amt)}
                  onReset={() => handleResetSingle('baptism')}
                />

                <SemiCircleGauge
                  title="출석"
                  subtitle="SUNDAY ATTENDANCE"
                  value={metrics.attendance}
                  target={targets.attendance}
                  color="#f59e0b"
                  unit="명"
                  iconName="compass"
                  quickSteps={[1, 2, 5]}
                  onAdd={(amt) => handleAddValue('attendance', '출석', amt)}
                  onReset={() => handleResetSingle('attendance')}
                />
              </div>

              <div className="mt-3 pt-2 border-t border-slate-900 flex items-center justify-between text-[10px] font-mono text-slate-500">
                <span>* 숫자가 누적되면 반원 트랙을 따라 컬러 게이지가 차오릅니다.</span>
                <span className="text-cyan-400">READY</span>
              </div>
            </section>

            <section className="lg:col-span-3">
              <SpeedometerBar
                value={metrics.online}
                target={targets.online}
                onAdd={(amt) => handleAddValue('online', '온라인선교', amt)}
                onReset={() => handleResetSingle('online')}
                onUndo={handleUndoOnline}
                canUndo={onlineHistory.length > 0}
              />
            </section>

            <section className="lg:col-span-3">
              <FuelGaugeBar
                value={metrics.prayer}
                target={targets.prayer}
                onAdd={(amt) => handleAddValue('prayer', '기도', amt)}
                onReset={() => handleResetSingle('prayer')}
                onUndo={handleUndoPrayer}
                canUndo={prayerHistory.length > 0}
                soundEnabled={soundEnabled}
              />
            </section>
          </main>

          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-lg shadow-2xl my-6">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <div className="flex items-center gap-2 text-cyan-400">
                    <LucideIcon name="settings-2" size={18} />
                    <h3 className="text-sm font-bold text-white font-mono">계기판 목표치 & 현재 위치 대륙 설정</h3>
                  </div>
                  <button
                    onClick={() => setShowConfigModal(false)}
                    className="text-slate-400 hover:text-white text-base font-mono font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveTargets} className="space-y-4 font-mono text-xs">
                  <div className="bg-slate-950/90 border border-cyan-500/40 rounded-xl p-3 shadow-inner">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-cyan-300 font-bold flex items-center gap-1.5 text-xs">
                        <LucideIcon name="globe-2" size={14} className="text-cyan-400" />
                        <span>현재 위치 대륙 선택 (6대륙 / 자동)</span>
                      </label>
                      <span className="text-[10px] text-slate-400">
                        {tempContinent === 'auto' ? '진척도 자동 연동 중' : '수동 고정 모드'}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mb-2">
                      <button
                        type="button"
                        onClick={() => setTempContinent('auto')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'auto'
                            ? 'bg-cyan-600 text-slate-950 border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.4)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🔄 자동 계산
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('asia')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'asia'
                            ? 'bg-cyan-500/30 text-cyan-300 border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🌏 아시아 (10%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('oceania')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'oceania'
                            ? 'bg-emerald-500/30 text-emerald-300 border-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🏝️ 오세아니아 (20%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('africa')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'africa'
                            ? 'bg-yellow-500/30 text-yellow-300 border-yellow-400 shadow-[0_0_10px_rgba(234,179,8,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🌍 아프리카 (40%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('south_america')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'south_america'
                            ? 'bg-blue-500/30 text-blue-300 border-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🌎 남아메리카 (60%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('north_america')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'north_america'
                            ? 'bg-pink-500/30 text-pink-300 border-pink-400 shadow-[0_0_10px_rgba(236,72,153,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🗽 북아메리카 (80%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('europe')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'europe'
                            ? 'bg-purple-500/30 text-purple-300 border-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.3)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        🏰 유럽 (90%)
                      </button>

                      <button
                        type="button"
                        onClick={() => setTempContinent('heaven')}
                        className={`py-1.5 px-2 rounded-lg text-xs font-bold border transition-all text-center ${
                          tempContinent === 'heaven'
                            ? 'bg-amber-500/30 text-amber-300 border-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.4)]'
                            : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                        }`}
                      >
                        👑 천국 입성 (100%)
                      </button>
                    </div>

                    <select
                      value={tempContinent}
                      onChange={(e) => setTempContinent(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500"
                    >
                      <option value="auto">🔄 자동 연동 (종합 비행 진척도 기준)</option>
                      <option value="asia">🌏 아시아 대륙 (Asia - 10%)</option>
                      <option value="oceania">🏝️ 오세아니아 대륙 (Oceania - 20%)</option>
                      <option value="africa">🌍 아프리카 대륙 (Africa - 40%)</option>
                      <option value="south_america">🌎 남아메리카 대륙 (South America - 60%)</option>
                      <option value="north_america">🗽 북아메리카 대륙 (North America - 80%)</option>
                      <option value="europe">🏰 유럽 대륙 (Europe - 90%)</option>
                      <option value="heaven">👑 천국 입성 (Heaven Entry - 100%)</option>
                      <option value="base">🛫 본부 기지 (Departure Base - 0%)</option>
                    </select>
                  </div>

                  <div>
                    <span className="text-slate-400 text-[11px] block mb-2 font-bold">각 지표별 최대 기준 목표치 (Scale)</span>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                      <div>
                        <label className="text-slate-300 block mb-1">단순전도 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.simple}
                          onChange={(e) => setTempTargets({ ...tempTargets, simple: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                      <div>
                        <label className="text-slate-300 block mb-1">유효전도 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.valid}
                          onChange={(e) => setTempTargets({ ...tempTargets, valid: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                      <div>
                        <label className="text-slate-300 block mb-1">침례 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.baptism}
                          onChange={(e) => setTempTargets({ ...tempTargets, baptism: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                      <div>
                        <label className="text-slate-300 block mb-1">출석 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.attendance}
                          onChange={(e) => setTempTargets({ ...tempTargets, attendance: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                      <div>
                        <label className="text-slate-300 block mb-1">온라인선교 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.online}
                          onChange={(e) => setTempTargets({ ...tempTargets, online: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                      <div>
                        <label className="text-slate-300 block mb-1">기도 연료 목표</label>
                        <input
                          type="number"
                          min="1"
                          value={tempTargets.prayer}
                          onChange={(e) => setTempTargets({ ...tempTargets, prayer: parseInt(e.target.value) || 1 })}
                          className="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white focus:border-cyan-500"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="flex gap-2 justify-end pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowConfigModal(false)}
                      className="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold shadow"
                    >
                      저장 적용
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
